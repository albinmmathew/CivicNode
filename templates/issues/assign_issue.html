{% extends "base.html" %}

{% block title %}Assign Issue - CivicNode{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
    <h2 class="mb-1">Assign Issue</h2>

    <div class="card" style="background: var(--background); box-shadow: none; border-style: dashed;">
        <h3>{{ issue.title }}</h3>
        <p class="text-muted mt-1">{{ issue.description }}</p>
    </div>

    <form method="post" class="mt-1">
        {% csrf_token %}

        <label for="staff">Select Staff Member</label>
        <select name="staff" id="staff" required>
            <option value="">-- Choose Staff --</option>
            {% for staff in staff_users %}
            <option value="{{ staff.id }}">
                {{ staff.username }}
            </option>
            {% endfor %}
        </select>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Assign to Staff</button>
    </form>
</div>
{% endblock %}
