{% extends 'base.html' %}

{% block title %}Login - CivicNode{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 glass p-10 rounded-[2.5rem] shadow-2xl relative overflow-hidden">
        <!-- Decor -->
        <div class="absolute top-0 right-0 -mr-16 -mt-16 w-32 h-32 bg-accent/10 rounded-full blur-3xl"></div>
        <div class="absolute bottom-0 left-0 -ml-16 -mb-16 w-32 h-32 bg-blue-400/10 rounded-full blur-3xl"></div>

        <div class="relative">
            <div class="text-center">
                <div
                    class="inline-flex items-center justify-center w-16 h-16 bg-accent rounded-2xl text-white text-2xl font-bold shadow-lg shadow-blue-200 mb-4">
                    CN
                </div>
                <h2 class="text-3xl font-extrabold text-primary tracking-tight">Welcome Back</h2>
                <p class="mt-2 text-sm text-slate-500">Sign in to your community portal</p>
            </div>

            <form class="mt-8 space-y-6" method="POST">
                {% csrf_token %}
                <div class="space-y-4">
                    <div>
                        <label for="username"
                            class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2 px-1">Username</label>
                        <input id="username" name="username" type="text" required
                            class="appearance-none block w-full px-5 py-4 border border-slate-200 placeholder-slate-400 text-slate-900 rounded-2xl focus:outline-none focus:ring-2 focus:ring-accent focus:border-transparent transition-all bg-white/50"
                            placeholder="alex_citizen">
                    </div>
                    <div>
                        <label for="password"
                            class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2 px-1">Password</label>
                        <input id="password" name="password" type="password" required
                            class="appearance-none block w-full px-5 py-4 border border-slate-200 placeholder-slate-400 text-slate-900 rounded-2xl focus:outline-none focus:ring-2 focus:ring-accent focus:border-transparent transition-all bg-white/50"
                            placeholder="••••••••">
                    </div>
                </div>

                <div class="flex items-center justify-between px-1">
                    <div class="flex items-center">
                        <input id="remember-me" name="remember-me" type="checkbox"
                            class="h-4 w-4 text-accent focus:ring-accent border-slate-300 rounded-md">
                        <label for="remember-me" class="ml-2 block text-sm text-slate-500">Remember me</label>
                    </div>
                    <div class="text-sm">
                        <a href="#" class="font-semibold text-accent hover:text-blue-700 transition-colors">Forgot
                            password?</a>
                    </div>
                </div>

                <button type="submit"
                    class="group relative w-full flex justify-center py-4 px-4 border border-transparent text-sm font-bold rounded-2xl text-white bg-slate-900 hover:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-slate-900 transition-all shadow-xl hover:-translate-y-0.5 active:translate-y-0">
                    Sign in to CivicNode
                </button>

                <div class="text-center mt-6">
                    <p class="text-sm text-slate-500">
                        New here?
                        <a href="{% url 'register' %}"
                            class="font-bold text-accent hover:text-blue-700 transition-colors">Create an account</a>
                    </p>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
